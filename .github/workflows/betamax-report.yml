name: Betamax report

on:
  # The pinned reporter validates artifacts and never executes PR code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Betamax]
    types: [completed]

permissions: {}

concurrency:
  group: betamax-report-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged job.
      - name: Update preview comment
        uses: joshka/betamax-action/report@34b48d5acd439f60d3e03ccabf2539dfe93527f2
        with:
          workflow: betamax.yml
          # Gallery artifacts have per-variant limits. Inline attachments would
          # impose a 20-file/40-MiB aggregate limit on the entire manual collection.
          mode: artifacts
