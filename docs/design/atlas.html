<style>
#jk-atlas { --jk-bg:light-dark(#faf9f6,#10151d); --jk-fg:light-dark(#262b31,#d0d5df); --jk-muted:light-dark(#616971,#949da9); --jk-line:light-dark(#d2d6d8,#343d48); --jk-surface:light-dark(#f1f1ed,#1a222c); --jk-select:light-dark(#e2e9e7,#25312f); --jk-accent:light-dark(#17645f,#81b9ad); --jk-green:light-dark(#256536,#89ba83); --jk-red:light-dark(#9e393c,#d48a8c); --jk-purple:light-dark(#7b438c,#c191d5); --jk-yellow:light-dark(#806120,#c6ae71); --jk-blue:light-dark(#355f9a,#8caed9); color:var(--jk-fg); font:14px/1.55 ui-monospace,'SFMono-Regular',Consolas,monospace; }
#jk-atlas * { box-sizing:border-box; }
#jk-atlas .atlas-bar,#jk-atlas .atlas-caption,#jk-atlas .journey {color-scheme:light dark;}
#jk-atlas .atlas-bar { color:light-dark(#262b31,#d0d5df);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 12px;font:13px/1.5 system-ui,sans-serif; }
#jk-atlas .atlas-bar label { display:flex;align-items:center;gap:8px; }
#jk-atlas select,#jk-atlas .atlas-button {font:inherit;color:var(--jk-fg);background:var(--jk-surface);border:1px solid var(--jk-line);padding:6px 9px;border-radius:4px;max-width:100%;}
#jk-atlas .atlas-screen { flex:1;min-width:220px; }
#jk-atlas .atlas-screen select {width:100%;}
#jk-atlas .atlas-caption {display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0;color:var(--jk-muted);font:12px/1.5 system-ui,sans-serif;}
#jk-atlas .atlas-caption strong {font-weight:600;color:var(--jk-fg);}
#jk-atlas .journey {display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px/1.4 system-ui,sans-serif;margin:10px 0;}
#jk-atlas .journey button {font:inherit;color:var(--jk-muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:4px 0;}
#jk-atlas .journey button[aria-current=step] {color:var(--jk-accent);border-color:var(--jk-accent);}
#jk-atlas .terminal {background:var(--jk-bg);border:1px solid var(--jk-line);border-radius:6px;overflow:hidden;max-width:100%;}
#jk-atlas .windowbar {display:flex;align-items:center;gap:7px;padding:9px 14px;background:var(--jk-surface);color:var(--jk-muted);font:12px/1.4 system-ui,sans-serif;}
#jk-atlas .windowbar i {width:7px;height:7px;border:1px solid var(--jk-muted);border-radius:50%;}
#jk-atlas .windowbar span {margin-left:8px;}
#jk-atlas .scope {margin-left:auto!important;}
#jk-atlas .command-head {padding:8px 12px;display:flex;gap:12px;border-bottom:1px solid var(--jk-line);white-space:normal;overflow-wrap:anywhere;}
#jk-atlas .brand {color:var(--jk-accent);font-weight:600;}
#jk-atlas .command-title {flex:1;}
#jk-atlas .body {position:relative;height:510px;min-height:0;padding:12px 10px;overflow:auto;}
#jk-atlas .rows {min-width:max-content;}
#jk-atlas .line {white-space:pre;min-height:22px;display:flex;}
#jk-atlas .gutter {color:var(--jk-accent);display:inline-block;width:4ch;flex:0 0 4ch;user-select:none;}
#jk-atlas .selected {background:var(--jk-select);}
#jk-atlas[data-selection=marker] .selected {background:transparent;}
#jk-atlas .line-content {white-space:pre;}
#jk-atlas .muted {color:var(--jk-muted);}
#jk-atlas .add,.green {color:var(--jk-green);}
#jk-atlas .del {color:var(--jk-red);}
#jk-atlas .id {color:var(--jk-purple);}
#jk-atlas .hash {color:var(--jk-blue);}
#jk-atlas .ref {color:var(--jk-green);}
#jk-atlas .date {color:var(--jk-accent);}
#jk-atlas .author {color:var(--jk-yellow);}
#jk-atlas .section {color:var(--jk-fg);font-weight:600;}
#jk-atlas mark {background:var(--jk-yellow);color:var(--jk-bg);}
#jk-atlas .overlay {position:relative;margin:12px auto;max-width:78ch;width:100%;background:var(--jk-surface);border:1px solid var(--jk-line);padding:12px 16px;z-index:2;max-height:calc(100% - 92px);overflow:auto;}
#jk-atlas .overlay .rows {min-width:0;}
#jk-atlas .overlay .line-content {white-space:pre-wrap;overflow-wrap:anywhere;}
#jk-atlas .overlay .line {white-space:normal;}
#jk-atlas .overlay h3 {font:600 14px/1.5 ui-monospace,monospace;color:var(--jk-accent);margin:0 0 14px;}
#jk-atlas .context-graph {height:58px;overflow:hidden;color:var(--jk-muted);margin-bottom:10px;}
#jk-atlas .context-graph .line {background:transparent;}
#jk-atlas .context-graph .gutter {visibility:hidden;}
#jk-atlas .preview-command {border-top:1px solid var(--jk-line);padding:12px 0 0;margin-top:14px;overflow-wrap:anywhere;white-space:pre-wrap;}
#jk-atlas .preview-command .muted {display:block;margin-bottom:4px;}
#jk-atlas .status {padding:6px 12px;color:var(--jk-muted);border-top:1px solid var(--jk-line);min-height:32px;}
#jk-atlas .hotbar {display:flex;flex-wrap:wrap;gap:4px 18px;padding:7px 12px;background:var(--jk-surface);}
#jk-atlas .hotbar button {font:inherit;padding:2px 0;border:0;background:transparent;color:var(--jk-fg);}
#jk-atlas .hotbar kbd {font:inherit;color:var(--jk-accent);margin-right:7px;}
#jk-atlas .input-label {display:block;color:var(--jk-muted);margin:0 0 12px;}
#jk-atlas input {font:inherit;display:block;width:100%;border:0;border-bottom:1px solid var(--jk-accent);border-radius:0;background:var(--jk-bg);color:var(--jk-fg);padding:6px 8px;margin-top:4px;}
#jk-atlas .catalog-list {display:grid;gap:0;}
#jk-atlas .catalog-list button {font:inherit;text-align:left;border:0;background:transparent;color:var(--jk-fg);padding:5px 8px;display:grid;grid-template-columns:24ch 1fr;gap:12px;}
#jk-atlas .catalog-list button:hover,#jk-atlas .catalog-list button:focus-visible {background:var(--jk-select);}
#jk-atlas .catalog-list .desc {color:var(--jk-muted);font-size:12px;}
#jk-atlas .help-details {margin-top:14px;color:var(--jk-muted);}
#jk-atlas .help-details pre {font:inherit;white-space:pre-wrap;color:var(--jk-fg);}
#jk-atlas .terminal.compact {max-width:72ch;}
#jk-atlas[data-density=roomy] .line {min-height:26px;}
#jk-atlas .terminal.compact .body {height:360px;}
@media(max-width:650px){#jk-atlas{font-size:12px;}#jk-atlas .body{height:430px;padding:8px 4px;}#jk-atlas .overlay{padding:10px 8px;}#jk-atlas .catalog-list button{grid-template-columns:1fr;gap:0;}#jk-atlas .scope{display:none;}#jk-atlas .atlas-screen{min-width:100%;}#jk-atlas .hotbar{gap:4px 12px;}}
</style>
<div id="jk-atlas" aria-label="jk TUI design atlas">
  <div class="atlas-bar">
    <label class="atlas-screen">Screen <select id="jk-screen" aria-label="Mockup screen"></select></label>
    <button class="atlas-button cursor-interaction" id="jk-prev" aria-label="Previous mockup">←</button>
    <button class="atlas-button cursor-interaction" id="jk-next" aria-label="Next mockup">→</button>
    <label>Journey <select id="jk-journey" aria-label="Workflow journey"><option value="">All screens</option></select></label>
    <button class="atlas-button cursor-interaction" id="jk-baseline-toggle">Show existing capture</button>
  </div>
  <div id="jk-baseline" hidden></div>
  <div class="atlas-caption"><strong id="jk-screen-title"></strong><span id="jk-count"></span></div>
  <div id="jk-steps" class="journey" aria-label="Journey steps"></div>
  <div class="terminal" id="jk-terminal" tabindex="0" aria-label="Interactive terminal mockup">
    <div class="windowbar"><i></i><i></i><i></i><span>jk</span><span class="scope" id="jk-scope">/work/jk · default</span></div>
    <div class="command-head"><span class="brand">jk</span><span class="command-title" id="jk-command"></span></div>
    <div class="body" id="jk-body"></div>
    <div class="status" id="jk-status"></div>
    <div class="hotbar" id="jk-hotbar"></div>
  </div>
  <div class="atlas-caption"><span id="jk-note"></span><span>Design study · synthetic repository · no commands execute</span></div>
</div>
<script>
(() => {
const inventory = {"version": "jj 0.45.1", "scope": "Visible command leaves; aliases share their canonical screen; hidden commands excluded.", "commands": [{"command": "abandon", "help": "Abandon a revision\n\nUsage: jj abandon [OPTIONS] [REVSETS]...\n\nArguments:\n  [REVSETS]...  The revision(s) to abandon (default: @) [aliases: -r]\n\nOptions:\n      --retain-bookmarks     Do not delete bookmarks pointing to the revisions to abandon\n      --restore-descendants  Do not modify the content of the children of the abandoned commits\n  -h, --help                 Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "absorb", "help": "Move changes from a revision into the stack of mutable revisions\n\nUsage: jj absorb [OPTIONS] [FILESETS]...\n\nArguments:\n  [FILESETS]...  Move only changes to these paths (instead of all paths)\n\nOptions:\n  -f, --from <REVSET>   Source revision to absorb from [default: @]\n  -t, --into <REVSETS>  Destination revisions to absorb into [default: mutable()] [alias: --to]\n  -i, --interactive     Interactively choose which parts to absorb\n      --tool <NAME>     Specify diff editor to be used (implies --interactive)\n  -h, --help            Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "arrange", "help": "Interactively arrange the commit graph\n\nUsage: jj arrange [OPTIONS] [REVSETS]...\n\nArguments:\n  [REVSETS]...  The revisions to arrange [aliases: -r]\n\nOptions:\n  -h, --help  Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bisect run", "help": "Run a given command to find the first bad revision\n\nUsage: jj bisect run [OPTIONS] --range <REVSETS> [COMMAND] [ARGS]...\n\nArguments:\n  [COMMAND]  Command to run to determine the status of a revision\n  [ARGS]...  Arguments to pass to the command\n\nOptions:\n  -r, --range <REVSETS>  Range of revisions to bisect (can be repeated)\n      --find-good        Find the first good revision instead\n  -h, --help             Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark advance", "help": "Advance the closest bookmarks to a target revision\n\nUsage: jj bookmark advance [OPTIONS] [NAMES]...\n\nArguments:\n  [NAMES]...  Move bookmarks matching the given name patterns\n\nOptions:\n  -t, --to <REVSET>  Move bookmarks to this revision\n  -h, --help         Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark create", "help": "Create a new bookmark\n\nUsage: jj bookmark create [OPTIONS] <NAMES>...\n\nArguments:\n  <NAMES>...  The bookmarks to create\n\nOptions:\n  -r, --revision <REVSET>  The bookmark's target revision [default: @] [alias: --to]\n  -h, --help               Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark delete", "help": "Delete an existing bookmark and propagate the deletion to remotes on the next push\n\nUsage: jj bookmark delete [OPTIONS] <NAMES>...\n\nArguments:\n  <NAMES>...  The bookmarks to delete\n\nOptions:\n  -h, --help  Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark forget", "help": "Forget a bookmark without marking it as a deletion to be pushed\n\nUsage: jj bookmark forget [OPTIONS] <NAMES>...\n\nArguments:\n  <NAMES>...  The bookmarks to forget\n\nOptions:\n      --include-remotes  When forgetting a local bookmark, also forget any corresponding remote\n                         bookmarks\n  -h, --help             Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark list", "help": "List bookmarks and their targets\n\nUsage: jj bookmark list [OPTIONS] [NAMES]...\n\nArguments:\n  [NAMES]...  Show bookmarks whose local name matches\n\nOptions:\n  -a, --all-remotes          Show all tracked and untracked remote bookmarks including the ones\n                             whose targets are synchronized with the local bookmarks\n      --remote <REMOTE>      Show all tracked and untracked remote bookmarks belonging to this\n                             remote\n  -t, --tracked              Show tracked remote bookmarks only\n  -c, --conflicted           Show conflicted bookmarks only\n  -r, --revision <REVSETS>   Show bookmarks whose local targets are in the given revisions\n  -T, --template <TEMPLATE>  Render each bookmark using the given template\n      --sort <SORT_KEY>      Sort bookmarks based on the given key (or multiple keys) [possible\n                             values: name, name-, author-name, author-name-, author-email,\n                             author-email-, author-date, author-date-, committer-name,\n                             committer-name-, committer-email, committer-email-, committer-date,\n                             committer-date-]\n  -h, --help                 Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark move", "help": "Move existing bookmarks to target revision\n\nUsage: jj bookmark move [OPTIONS] <NAMES|--from <REVSETS>>\n\nArguments:\n  [NAMES]...  Move bookmarks matching the given name patterns\n\nOptions:\n  -f, --from <REVSETS>   Move bookmarks from the given revisions\n  -t, --to <REVSET>      Move bookmarks to this revision [default: @]\n  -B, --allow-backwards  Allow moving bookmarks backwards or sideways\n  -h, --help             Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark rename", "help": "Rename `old` bookmark name to `new` bookmark name\n\nUsage: jj bookmark rename [OPTIONS] <OLD> <NEW>\n\nArguments:\n  <OLD>  The old name of the bookmark\n  <NEW>  The new name of the bookmark\n\nOptions:\n      --overwrite-existing  Allow renaming even if the new bookmark name already exists\n  -h, --help                Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark set", "help": "Create a new bookmark, or update an existing one by name\n\nUsage: jj bookmark set [OPTIONS] <NAMES>...\n\nArguments:\n  <NAMES>...  The bookmarks to update\n\nOptions:\n  -r, --revision <REVSET>  The bookmark's target revision [default: @] [alias: --to]\n  -B, --allow-backwards    Allow moving the bookmark backwards or sideways\n  -h, --help               Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark track", "help": "Start tracking given remote bookmarks\n\nUsage: jj bookmark track [OPTIONS] <BOOKMARK[@REMOTE]>...\n\nArguments:\n  <BOOKMARK[@REMOTE]>...  Bookmark name patterns or remote bookmark symbols to track\n\nOptions:\n      --remote <REMOTE>  Remote names to track\n  -h, --help             Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "bookmark untrack", "help": "Stop tracking given remote bookmarks\n\nUsage: jj bookmark untrack [OPTIONS] <BOOKMARK[@REMOTE]>...\n\nArguments:\n  <BOOKMARK[@REMOTE]>...  Bookmark name patterns or remote bookmark symbols to untrack\n\nOptions:\n      --remote <REMOTE>  Remote names to untrack\n  -h, --help             Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "commit", "help": "Update the description and create a new change on top [default alias: ci]\n\nUsage: jj commit [OPTIONS] [FILESETS]...\n\nArguments:\n  [FILESETS]...  Put these paths in the current commit\n\nOptions:\n  -i, --interactive        Interactively choose which changes to include in the current commit\n      --tool <NAME>        Specify diff editor to be used (implies --interactive)\n  -m, --message <MESSAGE>  The change description to use (don't open editor)\n      --editor             Open an editor to edit the change description\n  -h, --help               Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "config edit", "help": "Start an editor on a jj config file\n\nUsage: jj config edit [OPTIONS] <--user|--repo|--workspace|--file <PATH>>\n\nOptions:\n      --user         Target the user-level config\n      --repo         Target the repo-level config\n      --workspace    Target the workspace-level config\n      --file <PATH>  Target the config file specified by the given path\n  -h, --help         Pr {"command": "diff", "help": "Compare file contents between two revisions\n\nUsage: jj diff [OPTIONS] [FILESETS]...\n\nArguments:\n  [FILESETS]...  Restrict the diff to these paths\n\nOptions:\n  -r, --revisions <REVSETS>  Show changes in these revisions\n  -f, --from <REVSET>        Show changes from this revision\n  -t, --to <REVSET>          Show changes to this revision\n  -h, --help                 Print help (see more with '--help')\n\nDiff Formatting Options:\n  -T, --template <TEMPLATE>  Render each file diff entry using the given template\n  -s, --summary              For each path, show only whether it was modified, added, or deleted\n      --stat                 Show a histogram of the changes\n      --types                For each path, show only its type before and after\n      --name-only            For each path, show only its path\n      --git                  Show a Git-format diff\n      --color-words          Show a word-level diff with changes indicated only by color\n      --tool <TOOL>          Generate diff by external command\n      --context <CONTEXT>    Number of lines of context to show\n  -w, --ignore-all-space     Ignore whitespace when comparing lines\n  -b, --ignore-space-change  Ignore changes in amount of whitespace when comparing lines\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "diffedit", "help": "Touch up the content changes in a revision with a diff editor\n\nUsage: jj diffedit [OPTIONS] [FILESETS]...\n\nArguments:\n  [FILESETS]...  Edit only these paths (unmatched paths will remain unchanged)\n\nOptions:\n  -r, --revision <REVSET>    The revision to touch up\n  -f, --from <REVSET>        Show changes from this revision\n  -t, --to <REVSET>          Edit changes in this revision\n      --tool <NAME>          Specify diff editor to be used\n      --restore-descendants  Preserve the content (not the diff) when rebasing descendants\n  -h, --help                 Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "duplicate", "help": "Create new changes with the same content as existing ones\n\nUsage: jj duplicate [OPTIONS] [REVSETS]...\n\nArguments:\n  [REVSETS]..  copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "evolog", "help": "Show how a change has evolved over time\n\nUsage: jj evolog [OPTIONS]\n\nOptions:\n  -r, --revisions <REVSETS>  Follow changes from these revisions [default: @]\n  -n, --limit <LIMIT>        Limit number of revisions to show\n      --reversed             Show revisions in the opposite order (older revisions first)\n  -G, --no-graph             Show a flat list of revisions instead of a graph\n  -T, --template <TEMPLATE>  Render each revision using the given template\n  -p, --patch                Show patch compared to the previous version of this change\n  -h, --help                 Print help (see more with '--help')\n\nDiff Formatting Options:\n  -s, --summary              For each path, show only whether it was modified, added, or deleted\n      --stat                 Show a histogram of the changes\n      --types                For each path, show only its type before and after\n      --name-only            For each path, show only its path\n      --git                  Show a Git-format diff\n      --color-words          Show a word-level diff with changes indicated only by color\n      --tool <TOOL>          Generate diff by external command\n ]...  Only list files matching these prefixes (instead of all files)\n\nOptions:\n  -r, --revision <REVSET>    The revision to list files in [default: @]\n  -T, --template <TEMPLATE>  Render each file entry using the given template\n  -h, --help                 Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "file search", "help": "Search for content in files\n\nUsage: jj file search [OPTIONS] --pattern <PATTERN> [FILESETS]...\n\nArguments:\n  [FILESETS]...  Only search files matching these prefixes (instead of all files)\n\nOptions:\n  -r, --revision <REVSET>  The revision to search files in [default: @]\n  -p, --pattern <PATTERN>  The pattern to search for in a single line\n      --name-only          Print only the paths of files that contain a match, not the matched lines\n  -n, --line-number        Prefix each matched line with its 1-based line number within the file\n  -h, --help               Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ig ommand as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "fix", "help": "Update files with formatting fixes or other changes\n\nUsage: jj fix [OPTIONS] [FILESETS]...\n\nArguments:\n  [FILESETS]...  Fix only these paths\n\nOptions:\n  -s, --source <REVSETS>         Fix files in the specified revision(s) and their descendants. If no\n                                 revisions are specified, this defaults to the `revsets.fix`\n                                 setting, or `reachable(@, mutable())` if it is not set\n      --include-unchanged-files  Fix unchanged files in addition to changed ones. If no paths are\n                                 specified, all files in the repo will be fixed\n  -a, --all-lines                Format all lines instead of only modified lines\n  -h, --help                     Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug              Print the number of commits instead of showing them\n  -h, --help                 Print help (see more with '--help')\n\nDiff Formatting Options:\n  -s, --summary              For each path, show only whether it was modified, added, or deleted\n      --stat                 Show a histogram of the changes\n      --types                For each path, show only its type before and after\n      --name-only            For each path, show only its path\n      --git                  Show a Git-format diff\n      --color-words          Show a word-level diff with changes indicated only by color\n      --tool <TOOL>          Generate diff by external command\n      --context <CONTEXT>    Number of lines of context to show\n      --ignore-all-space     Ignore whitespace when comparing lines\n      --ignore-space-change  Ignore changes in amount of whitespace when comparing lines\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "metaedit", "help": "Modify the metadata of a revision without changing its content\n\nUsage: jj metaedit [OPTIONS] [REVSETS]...\n\nArguments:\n  [REVSETS]...  The revision(s) to modify (default: @) [aliases: -r]\n\nOptions:\n      --update-change-id                     Generate a new change-id\n  -m, --message <MESSAGE>                    Update the change description\n      --update-author-timestamp              Update the author timestamp\n      --update-author                        Update the author to the configured user\n      --author <AUTHOR>                      Set author to the provided string\n      --author-timestamp <AUTHOR_TIMESTAMP>  Set the author date to the given date\n      --force-rewrite                        Rewrite the commit, even if no other metadata changed\n  -h, --help                                 Print help (see more with '--help')\n\nGlobal Options:\n  -R, --repository <REPOSITORY>      Path to repository to operate on\n      --ignore-working-copy          Don't snapshot the working copy, and don't update it\n      --no-integrate-operation       Run the command as usual but don't integrate any operations\n      --ignore-immutable             Allow rewriting immutable commits\n      --at-operation <AT_OPERATION>  Operation to load the repo at [alias: --at-op]\n      --debug                        Enable debug logging\n      --color <WHEN>                 When to colorize output [possible values: always, never, debug,\n                                     auto]\n      --quiet                        Silence non-primary command output\n      --no-pager                     Disable the pager\n      --config <NAME=VALUE>          Additional configuration options (can be repeated)\n      --config-file <PATH>           Additional configuration files (can be repeated)\n"}, {"command": "new", "help": "Create a new, empty change and (by default) edit it in the working copy\n\nUsage: jj new [OPTIONS] [REVSETS]...\n\nArguments:\n  [REVSETS]...  Parent(s) of the new change [default: @] [aliases: -o, -r]\n\nOptions:\n  -m, --message <MESSAGE>        The change description to use\n const root=document.getElementById('jk-atlas');
const el=id=>root.querySelector('#jk-'+id);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=new Map(screens.map(s=>[s.id,s]));
const preferences={appearance:'auto',selection:'subtle',density:'compact'};
let current='log',journey='',lastCommand=null;
let selectionOverride=null,markOverride=null,showBaseline=false;
const saved=window.openai?.widgetState;
function restore(state){const p=state?.privateContent;if(!p)return;if(byId.has(p.current))current=p.current;journey=journeys[p.journey]?p.journey:'';Object.assign(preferences,p.preferences||{});}
restore(saved);
function persist(){window.openai?.setWidgetState?.({modelContent:{screen:byId.get(current).title,command:byId.get(current).command,journey,appearance:preferences.appearance,selection:preferences.selection},privateContent:{current,journey,preferences}})?.catch(()=>{});}
function applyPrefs(){root.style.colorScheme=preferences.appearance==='auto'?'light dark':preferences.appearance;root.dataset.selection=preferences.selection;root.dataset.density=preferences.density;}
function color(text,query=''){
 let out=escape(text);
 // Fixture-only colorization approximates the jj palette in the baseline captures.
 out=out.replace(/\b(pvsouytl|qpvuntsm|mzrqpvnu|vtqsknru|zuktvkvo|ntwquvxs)\b/g,'<span class="id">$1</span>')
 .replace(/\b([a-f0-9]{8})\b/g,'<span class="hash">$1</span>')
 .replace(/\b(joshka)(?= |$)/g,'<span class="author">$1</span>')
 .replace(/(2026-\d\d-\d\d(?: \d\d:\d\d:\d\d)?)/g,'<span class="date">$1</span>')
 .replace(/\b(main|review-ui|default@)\b/g,'<span class="ref">$1</span>');
 if(query){const safe=escape(query).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');out=out.replace(new RegExp(`(${safe})`,'gi'),'<mark>$1</mark>');}
 return out;
}
function rows(s,context=false){return '<div class="rows">'+s.lines.map((line,i)=>{
 const selected=!context&&(selectionOverride??s.selected)===i;
 const marks=markOverride||s.marks||{};
 const gutter=(selected?'›':' ')+(marks[i]||' ')+' ';
 const kind=s.kinds?.[i]||(line.startsWith('+')?'add':line.startsWith('-')?'del':line.startsWith('Error:')?'del':'');
 return `<div class="line ${selected?'selected':''} ${kind}" data-row="${i}"><span class="gutter">${escape(gutter)}</span><span class="line-content">${color(line,s.query)}</span></div>`;
}).join('')+'</div>';}
function goto(id){if(!byId.has(id))throw new Error('Unknown screen '+id);const s=byId.get(current);if(id==='run-options'&&s.id!=='run-options'){const options=byId.get(id);options.command=s.command;options.actions=[btn('Enter','Apply options',s.id),btn('Esc','Cancel',s.id)];}if(s.command&&s.mode!=='result')lastCommand=s;current=id;selectionOverride=null;markOverride=null;render();persist();}
function fillSelect(){const groups=[...new Set(screens.map(s=>s.group))].sort();el('screen').innerHTML=groups.map(g=>`<optgroup label="${escape(g)}">${screens.filter(s=>s.group===g).map(s=>`<option value="${s.id}">${escape(s.title)}</option>`).join('')}</optgroup>`).join('');
 for(const j of Object.keys(journeys)){const opt=document.createElement('option');opt.value=j;opt.textContent=j;el('journey').append(opt);}}
function catalog(){return `<label class="input-label">Find a jj command<input id="jk-command-search" placeholder="rebase, bookmark, sparse…" autocomplete="off"></label><div class="catalog-list" id="jk-catalog"></div>`;}
function filterCatalog(query=''){const items=inventory.commands.filter(i=>(i.command+' '+i.help.split('\n')[0]).toLowerCase().includes(query.toLowerCase()));el('catalog').innerHTML=items.map(i=>`<button type="button" class="cursor-interaction" data-to="${commandTargets[i.command]}"><span>${escape(i.command)}</span><span class="desc">${escape(i.help.split('\n')[0])}</span></button>`).join('')||'<div>No matching commands.</div>';el('status').textContent=`${items.length} commands · installed ${inventory.version} · choose to inspect or preview`;}
function render(){applyPrefs();const s=byId.get(current);showBaseline=false;el('baseline').hidden=true;el('terminal').hidden=false;el('baseline-toggle').hidden=!baselines[current];el('baseline-toggle').textContent='Show existing capture';el('screen').value=current;el('journey').value=journey;el('screen-title').textContent=s.title;el('count').textContent=`${screens.indexOf(s)+1} / ${screens.length} screens · ${inventory.commands.length} command leaves`;
 el('terminal').classList.toggle('compact',!!s.compact);el('scope').textContent='/work/jk · '+(s.scope||'default');const header=s.modal?byId.get(s.base||'log'):s;el('command').textContent=header.command?'jj '+header.command:header.title;
 el('note').textContent=s.note||'Shared focus, marks, command preview, and return behavior.';
 const steps=journeys[journey]||[];el('steps').innerHTML=steps.map((id,i)=>`<button type="button" class="cursor-interaction" data-to="${id}" ${current===id?'aria-current="step"':''}>${i+1} ${escape(byId.get(id).title.split(' · ')[0])}</button>`).join('<span aria-hidden="true">→</span>');
 let body='';
 if(s.mode==='catalog')body=catalog();
 else if(s.mode==='result'){
 const source=lastCommand||byId.get('cmd-version');el('command').textContent='jj '+source.command;
 body=rows({lines:['Command result · illustrative','', 'Command    jj '+source.command, 'Outcome    completed · exit 0','',source.read?'Output remains selectable and can be copied.':'Repository refreshed; inspect operation history for recorded effects.','','Return restores the originating scope and selection.']});
 }else{
  body=rows(s);
  if(s.input)body=`<label class="input-label">${escape(s.input.label)}<input id="jk-field" value="${escape(s.input.value)}" aria-label="${escape(s.input.label)}"></label>`+body;
  if(s.modal){const base=byId.get(s.base||'log');body=`<div class="context-graph" aria-hidden="true">${rows(base,true)}</div><section class="overlay" aria-label="${escape(s.title)}"><h3>${escape(s.title)}</h3>${body}${s.command&&!s.id.startsWith('help')&&!['files','view-options','log-options','template-picker','actions','file-actions','revset','describe-form','commit-form'].includes(s.id)?`<div class="preview-command"><span class="muted">${s.mode==='preview'?'Command to run':'Command context'}</span>jj ${escape(s.command)}</div>`:''}</section>`;}
  if(s.help)body+=`<details class="help-details"><summary>Installed jj help · arguments and all options</summary><pre>${escape(s.help)}</pre></details>`;
 }
 el('body').innerHTML=body;el('body').scrollTop=0;el('body').scrollLeft=0;
 el('status').textContent=s.status||((s.selected!==undefined)?`${s.lines.length} rendered lines · selected object in gutter`:s.modal?'Esc returns to the previous context.':'');
 const actions=s.mode==='result'?[btn('Esc','Return',lastCommand?.id||'log'),btn('C','History','history')]:(s.actions||[btn('Esc','Back','log')]);el('hotbar').innerHTML=actions.map(a=>`<button type="button" class="cursor-interaction" data-to="${a.to}"><kbd>${escape(a.key)}</kbd>${escape(a.label)}</button>`).join('');
 const overlay=el('body').querySelector('.overlay');if(overlay){const status=el('status').textContent;const updateScroll=()=>{el('status').textContent=overlay.scrollHeight>overlay.clientHeight+1?((overlay.scrollTop>0?'↑ more above · ':'')+(overlay.scrollTop+overlay.clientHeight<overlay.scrollHeight-2?'↓ more below · ':'')+'Esc returns'):status;};overlay.addEventListener('scroll',updateScroll);updateScroll();}
 if(s.mode==='catalog'){filterCatalog();el('command-search').addEventListener('input',e=>filterCatalog(e.target.value));}
 if(s.input){el('field').addEventListener('input',e=>{if(current==='search'){const temp={...s,query:e.target.value};const box=el('body').querySelector('.rows');box.outerHTML=rows(temp);}else el('status').textContent='Draft edited · choose Review to inspect the illustrative next step.';});}
}
fillSelect();render();
root.addEventListener('click',e=>{const b=e.target.closest('[data-to]');if(b)goto(b.dataset.to);});
el('screen').addEventListener('change',e=>goto(e.target.value));
el('journey').addEventListener('change',e=>{journey=e.target.value;if(journey)goto(journeys[journey][0]);else{render();persist();}});
function step(delta){const list=journeys[journey]||screens.map(s=>s.id);let index=list.indexOf(current);index=(index+delta+list.length)%list.length;goto(list[index]);}
el('baseline-toggle').addEventListener('click',()=>{const b=baselines[current];if(!b)return;showBaseline=!showBaseline;el('baseline').hidden=!showBaseline;el('terminal').hidden=showBaseline;el('baseline-toggle').textContent=showBaseline?'Show proposed design':'Show existing capture';el('baseline').innerHTML=`<img style="display:block;width:100%;height:auto" src="${b.data}" alt="Existing capture ${escape(b.name)}">`;});
el('prev').addEventListener('click',()=>step(-1));el('next').addEventListener('click',()=>step(1));
el('terminal').addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;const s=byId.get(current);if(['j','k','ArrowDown','ArrowUp'].includes(e.key)&&s.selected!==undefined){e.preventDefault();const delta=['j','ArrowDown'].includes(e.key)?1:-1;const base=selectionOverride??s.selected;const nodes=s.lines.map((l,i)=>/^[│ ]*[○@◆]/.test(l)?i:-1).filter(i=>i>=0);const choices=nodes.length?nodes:s.lines.map((_,i)=>i);const index=choices.indexOf(base);selectionOverride=choices[Math.max(0,Math.min(choices.length-1,index+delta))];render();return;}
 if(e.key===' '&&s.selected!==undefined){e.preventDefault();const row=selectionOverride??s.selected;markOverride={...(markOverride||s.marks||{})};if(markOverride[row])delete markOverride[row];else markOverride[row]='✓';render();return;}
 const key=e.key==='Escape'?'Esc':e.key;const action=(s.actions||[]).find(a=>a.key===key);if(action){e.preventDefault();goto(action.to);}else if(key===':'||key==='?'){e.preventDefault();if(key===':')goto('command');else{const h=byId.get('help-current');h.title='Help · '+s.title;h.command=s.command;h.base=s.id;h.lines=['Available actions','',...(s.actions||[]).map(a=>'  '+a.key.padEnd(16)+a.label)];h.actions=[btn('Esc','Close help',s.id)];goto('help-current');}}});
window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:()=>{applyPrefs();persist();}});t.addSelect(preferences,'appearance',{label:'Terminal appearance',options:['auto','dark','light']});t.addSelect(preferences,'selection',{label:'Selection treatment',options:[{value:'subtle',label:'Quiet row + gutter'},{value:'marker',label:'Gutter only'}]});t.addSelect(preferences,'density',{label:'Row spacing',options:['compact','roomy']});}
// Expose only local design metadata for deterministic visual checks.
root.atlas={screens: screens.map(s=>({id:s.id,title:s.title,command:s.command,group:s.group})),commandTargets,goto,preferences,render};

})();
